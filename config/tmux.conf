# M-x goes directly to command mode (like emacs)
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix
bind-key -n M-x command-prompt

# Window navigation with vim keybindings
bind-key h previous-window
bind-key l next-window

# Split windows
bind-key | split-window -h
bind-key % split-window -v

# Pane navigation with vim keybindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Dark red colors (like git diff)
set-option -g status-style bg="#500000",fg=white
set-option -g pane-border-style fg="#500000"
set-option -g pane-active-border-style fg="#500000"

# Scroll using mouse
set -g mouse on

# Copy mode with vim keybindings
setw -g mode-keys vi
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi p send-keys -X cancel \; paste-buffer

# Copy mode with mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"


####
# Border Control
####

# 1. Turn off the border status track entirely
set -g pane-border-status off

# 2. Make the structural divider lines completely invisible 
# Replace "black" with your exact terminal window background color
set -g pane-border-style "fg=#171717,bg=#171717"
set -g pane-active-border-style "fg=#171717,bg=#171717"

# 3. Create the hovering illusion using pane backgrounds
# Inactive panes blend flatly into your dark terminal background
set -g window-style "fg=white,bg=#171717"

# Active pane gets a lighter, elevated "card" background to make it hover
set -g window-active-style "bg=#141414"


####
# Active Tab 
####

# 3. Highlight the active window tab in the status bar
set-window-option -g window-status-current-style bg="#BD9E17",fg="#500000,bold"
set-window-option -g window-status-current-format " #I:#W "

# 4. Style for the inactive windows in the status bar
set-window-option -g window-status-style fg="#aaaaaa",bg="#500000"
set-window-option -g window-status-format " #I:#W "

